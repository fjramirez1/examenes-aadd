<ui:composition template="/WEB-INF/template/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

	<ui:define name="title">Añadir episodio</ui:define>

	<ui:define name="content">

		<h:form id="formEpisodio">

			<p:growl id="msgs" showDetail="true" life="5000" />

			<h2>Añadir episodio en el podcast</h2>

			<p:panel header="Nuevo episodio"
				rendered="#{not empty anadirEpisodioBean.podcastId}">

				<p:panelGrid columns="2" layout="grid"
					styleClass="ui-panelgrid-blank">

					<p:outputLabel for="numEpisodio" value="Numero de episodio:" />
					<p:inputNumber id="numEpisodio"
						value="#{anadirEpisodioBean.nuevoEpisodio.numEpisodio}" min="1" />

					<p:outputLabel for="titulo" value="Titulo:" />
					<p:inputText id="titulo"
						value="#{anadirEpisodioBean.nuevoEpisodio.titulo}" />

					<p:outputLabel for="fechaPublicacion" value="Fecha Publicacion:" />
					<p:datePicker id="fechaPublicacion"
						value="#{anadirEpisodioBean.nuevoEpisodio.fechaPublicacion}" />

					<p:outputLabel for="duracionMinutos" value="Duracion en minutos:" />
					<p:inputNumber id="duracionMinutos"
						value="#{anadirEpisodioBean.nuevoEpisodio.duracionMinutos}"
						min="1" />

					<p:outputLabel for="descripcion" value="Descripcion:" />
					<p:inputText id="descripcion"
						value="#{anadirEpisodioBean.nuevoEpisodio.descripcion}" />

				</p:panelGrid>

				<p:divider />

				<p:commandButton value="Guardar" icon="pi pi-save"
					action="#{anadirEpisodioBean.guardarEpisodio}" update="@form" />

				<p:commandButton value="Cancelar" icon="pi pi-times"
					action="#{anadirEpisodioBean.cancelar}" process="@this"
					style="margin-left:10px;" />

			</p:panel>

		</h:form>

	</ui:define>

</ui:composition>
