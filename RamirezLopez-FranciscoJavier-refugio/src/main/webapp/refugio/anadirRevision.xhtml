<ui:composition template="/WEB-INF/template/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

	<ui:define name="title">Añadir revisión</ui:define>

	<ui:define name="content">

		<h:form id="formRevisión">

			<p:growl id="msgs" showDetail="true" life="5000" />

			<h2>Añadir revisión en el animal</h2>

			<p:panel header="Nueva revisión"
				rendered="#{anadirRevisionBean.animalSeleccionado != null}">

				<p:panelGrid columns="2" layout="grid"
					styleClass="ui-panelgrid-blank">

					<p:outputLabel for="fecha" value="Fecha de la revisión:" />
					<p:datePicker id="fecha"
						value="#{anadirRevisionBean.nuevaRevision.fecha}" />

					<p:outputLabel for="observaciones" value="Observaciones:" />
					<p:inputText id="observaciones"
						value="#{anadirRevisionBean.nuevaRevision.observaciones}" />

					<p:outputLabel for="peso" value="Peso (kg):" />
					<p:inputNumber id="peso"
						value="#{anadirRevisionBean.nuevaRevision.peso}" min="0" />

				</p:panelGrid>

				<p:divider />

				<p:commandButton value="Guardar" icon="pi pi-save"
					action="#{anadirRevisionBean.guardarRevision}" update="@form" />

				<p:commandButton value="Cancelar" icon="pi pi-times"
					action="#{anadirRevisionBean.cancelar}" process="@this"
					style="margin-left:10px;" />

			</p:panel>

		</h:form>

	</ui:define>

</ui:composition>
